#################################
# Backend
#################################
backend = "glx";
vsync = true;
use-damage = true;

#################################
# Shadows
#################################
shadow = true;              # Enable shadows
shadow-radius = 12;         # How soft the shadow is
shadow-offset-x = -10;      # Horizontal offset
shadow-offset-y = -10;      # Vertical offset
shadow-opacity = 0.5;       # Shadow transparency
shadow-ignore-shaped = false;

#################################
# Fading
#################################
fading = true;              # Enable fade in/out
fade-in-step = 0.03;        # Opacity change between steps while fading in
fade-out-step = 0.03;       # Opacity change between steps while fading out
fade-delta = 4;             # Time between steps in ms

#################################
# Transparency / Opacity
#################################
inactive-opacity = 0.8;     # Opacity of inactive windows
active-opacity = 1.0;       # Opacity of active windows
frame-opacity = 1.0;        # Frame transparency
inactive-opacity-override = false;

#################################
# Corners
#################################
corner-radius = 12;         # Rounded corner radius
round-borders = 1;          # Border rounding strength
rounded-corners-exclude = [
  "class_g = 'Rofi'",       # Don’t round corners on Rofi
  "class_g = 'i3bar'",      # Don’t round i3bar
  "class_g = 'Polybar'",    # Don’t round Polybar
  "class_g = 'Conky'"       # Don’t round Conky
];

#################################
# Blur
#################################
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

#################################
# General settings
#################################
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-transient = true;
unredir-if-possible = false;
refresh-rate = 0;

#################################
# Exclusions
#################################
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g = 'Rofi'",
  "class_g = 'i3bar'",
  "class_g = 'Polybar'"
];

opacity-rule = [
  "90:class_g = 'Alacritty'",
  "90:class_g = 'kitty'",
  "95:class_g = 'URxvt'"
];

